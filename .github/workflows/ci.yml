name: CI

on: 
  pull-request:
  push:
    branches: [main]
  
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - run: pip install -r requirements-dev.txt
    - run: ruff check .
    - run: ruff format --check .
  
  test:
    runs-on: ubunto-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: pytest

      

    